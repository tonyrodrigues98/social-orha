<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      background: #f6f5f1;
      color: #202022;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f6f5f1; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 520px;
              background: #ffffff;
              border: 1px solid #e9e7e1;
              border-radius: 24px;
            "
          >
            <tr>
              <td
                style="
                  padding: 40px 36px 16px;
                  font-size: 28px;
                  font-weight: 800;
                  letter-spacing: 0.08em;
                "
              >
                ORHA
              </td>
            </tr>
            <tr>
              <td style="padding: 0 36px 36px">
                <h1
                  style="
                    margin: 12px 0 14px;
                    font-size: 26px;
                    line-height: 1.25;
                  "
                >
                  Confirme seu e-mail
                </h1>
                <p
                  style="
                    margin: 0 0 24px;
                    color: #66646a;
                    font-size: 16px;
                    line-height: 1.6;
                  "
                >
                  Falta só confirmar este endereço para proteger sua conta e
                  começar a fazer parte da ORHA.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background: #202022;
                    color: #ffffff;
                    border-radius: 999px;
                    padding: 14px 24px;
                    font-size: 16px;
                    font-weight: 700;
                    text-decoration: none;
                  "
                  >Confirmar e-mail</a
                >
                <p
                  style="
                    margin: 28px 0 0;
                    color: #858289;
                    font-size: 13px;
                    line-height: 1.55;
                  "
                >
                  Se você não criou uma conta na ORHA, ignore esta mensagem.
                  Este link é pessoal e não deve ser compartilhado.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
