<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      background: #f6f5f1;
      color: #202022;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #f6f5f1; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 520px;
              background: #ffffff;
              border: 1px solid #e9e7e1;
              border-radius: 24px;
            "
          >
            <tr>
              <td
                style="
                  padding: 40px 36px 16px;
                  font-size: 28px;
                  font-weight: 800;
                  letter-spacing: 0.08em;
                "
              >
                ORHA
              </td>
            </tr>
            <tr>
              <td style="padding: 0 36px 36px">
                <h1
                  style="
                    margin: 12px 0 14px;
                    font-size: 26px;
                    line-height: 1.25;
                  "
                >
                  Sua senha foi alterada
                </h1>
                <p
                  style="
                    margin: 0 0 16px;
                    color: #66646a;
                    font-size: 16px;
                    line-height: 1.6;
                  "
                >
                  A senha da sua conta ORHA foi atualizada com sucesso.
                </p>
                <p
                  style="
                    margin: 0;
                    color: #858289;
                    font-size: 13px;
                    line-height: 1.55;
                  "
                >
                  Se não foi você, solicite imediatamente uma redefinição de
                  senha e entre em contato com o suporte da ORHA. Nunca
                  compartilhe senhas ou códigos de confirmação.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
