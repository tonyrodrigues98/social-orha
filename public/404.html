<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ORHA</title>
    <script>
      (() => {
        const repositoryBase = "/social-orha/";
        const currentPath = window.location.pathname;

        if (!currentPath.startsWith(repositoryBase)) {
          window.location.replace(repositoryBase);
          return;
        }

        const route = `${currentPath.slice(repositoryBase.length - 1)}${window.location.search}${window.location.hash}`;
        const target = `${repositoryBase}?__orha_route=${encodeURIComponent(route)}`;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
